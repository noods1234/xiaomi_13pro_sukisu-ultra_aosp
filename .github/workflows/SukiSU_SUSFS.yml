name: Build Kernels - SukiSU SUSFS

on:
  # push:
  #   paths:
  #     - ".github/workflows/kernelsu.yml"
  workflow_dispatch:
  #schedule:
  #  - cron: "14 13 * * 5"

jobs:
  Read-configuration:
    name: 🐂 Parse *.config.json
    runs-on: ubuntu-latest
    outputs:
      CONFIGS: ${{ steps.generate-matrix.outputs.CONFIGS }}
      BUILD_DATE: ${{ steps.generate-builddate.outputs.BUILDDATE }}
    steps:
      # This action checks-out your CONFIGSitory under $GITHUB_WORKSPACE, so your workflow can access it.
      - name: 😄 Checkout
        uses: actions/checkout@v4

      # Match the configuration files in the CONFIGS directory, read the contents and merge them into an array.
      - name: 😆 Generate Matrix
        id: generate-matrix
        run: |
          echo "CONFIGS<<EOF" >> $GITHUB_OUTPUT
          jq -s '[.[][]]' Kernel/configs/*.config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Set compile time.
      - name: ⏰ Set builddate
        id: generate-builddate
        run: echo "BUILDDATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-22.04
    needs:
      - Read-configuration
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        CONFIG: ${{ fromJSON(needs.Read-configuration.outputs.CONFIGS) }}
    env:
      # Basic configuration
      WORKSPACE: ${{ github.workspace }}
      BUILD_DATE: "${{ needs.Read-configuration.outputs.BUILD_DATE }}"

      # Kernel source configuration
      KERNEL_NAME: ${{ matrix.CONFIG.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.CONFIG.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.CONFIG.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.CONFIG.kernelSource.device }}
      KERNEL_DEFCONFIG_PATH: ${{ matrix.CONFIG.kernelSource.defconfig }}

      # Whether to use ccache to speed up compilation
      ENABLE_CCACHE: ${{ matrix.CONFIG.enableCcache }}

      # Whether to use ANYKERNEL3 packaged flash package
      USE_ANYKERNEL3: ${{ matrix.CONFIG.AnyKernel3.use }}

      # Whether to publish
      CONFIRM_RELEASE: ${{ matrix.CONFIG.AnyKernel3.release }}

      # Whether to enable KernelSU
      ENABLE_KERNELSU: ${{ matrix.CONFIG.enableKernelSU }}

      # Whether to enable KernelSU SFS
      ENABLE_KERNELSU_SFS: ${{ matrix.CONFIG.KernelSUSFS.enable }}

      # Whether to enable LXC docker
      ENABLE_LXC: ${{ matrix.CONFIG.enableLXC }}

      # Whether to override GKI-locked HZ=300 with HZ=1000 (experimental, breaks GKI ABI)
      ENABLE_HZ_1000: ${{ matrix.CONFIG.enableHZ1000 }}

      # Set output & ccache directory
      OUT_DIR: "${{ github.workspace }}/out"
      CCACHE_DIR: "${{ github.workspace }}/ccache"
    steps:
      # Set swap space
      - name: 📐 Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      # This action checks-out your CONFIGSitory under $GITHUB_WORKSPACE, so your workflow can access it.
      - name: 😄 Checkout
        uses: actions/checkout@v4

      # Install prerequisites for Ubuntu
      - name: ⭐ Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python2 python2-dev python3
          sudo apt-get install -y pngcrush schedtool dpkg-dev liblz4-tool make optipng maven dwarves device-tree-compiler 
          sudo apt-get install -y libc6-dev-i386 libelf-dev lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc
          sudo apt-get install -y libxml2-utils libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools lzop flex tree
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl 
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar llvm g++-multilib bison gperf zlib1g-dev automake

      # Initialize ccache
      - name: 🚄 Setup ccache
        if: ${{ env.ENABLE_CCACHE == 'true' }}
        id: hash
        run: |
          # Create output directory
          mkdir -p ${{ env.OUT_DIR }}

          # Initialize ccache
          ccache -o compression=false -o cache_dir=${{ env.CCACHE_DIR }}

          # Generate configuration's hash
          echo $(echo -n '${{ toJSON(matrix.config) }}' | openssl dgst -sha1 | awk '{print $2}')
          echo "HASH=$(echo -n '${{ toJSON(matrix.config) }}' | openssl dgst -sha1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: 🚅 Cache ccache & output
        env:
          HASH: ${{ steps.hash.outputs.HASH }}
        if: ${{ env.ENABLE_CCACHE == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.OUT_DIR }}
            ${{ env.CCACHE_DIR }}
          key: cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-${{ env.BUILD_DATE }}
          restore-keys: |
            cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-${{ env.BUILD_DATE }}
            cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-
            cache-${{ env.KERNEL_NAME }}-

      - name: 🌟 Clone kernel source => (${{ env.KERNEL_REPO }})
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }}
          # tree ${{ env.KERNEL_NAME }}

      - name: 📱 Apply ishtar vendor config fragment
        run: |
          cd ${{ env.KERNEL_NAME }}
          VENDOR_FRAGMENT="arch/arm64/configs/vendor/ishtar_GKI.config"
          if [ -f "$VENDOR_FRAGMENT" ]; then
            echo "✅ Found ishtar_GKI.config — merging into gki_defconfig"
            scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig "$VENDOR_FRAGMENT"
            cp .config arch/arm64/configs/gki_defconfig
            echo "✅ ishtar vendor fragment merged"
          else
            echo "⚠️  ishtar_GKI.config not found — using base gki_defconfig only"
          fi

      - name: 💫 Get toolchains
        env:
          toolchains: "${{ toJSON(matrix.CONFIG.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo "🤔 There is $toolchains_num defined toolchains."

          for ((i=0;i<toolchains_num;i++)); do
            toolchain=$(echo $toolchains | jq -r ".[$i]")

            toolchain_name=$(echo $toolchain | jq -r ".name")
            
            # From archive
            if echo $toolchain | jq -e 'has("url")' > /dev/null; then
              # If from archive
              toolchain_url=$(echo $toolchain | jq -r ".url")
              mkdir -p "$toolchain_name"

              # Download archive
              wget "$toolchain_url"

              # Get filename
              filename="${toolchain_url##*/}"
              case "$filename" in
                *.zip)
                  unzip -d "$toolchain_name" "$filename"
                  ;;
                *.tar)
                  tar xvf "$filename" -C "$toolchain_name"
                  ;;
                *.tar.gz)
                  tar zxvf "$filename" -C "$toolchain_name"
                  ;;
                *.rar)
                  unrar x "$filename" "$toolchain_name"
                  ;;
                *)
                  echo "unknown file type: $filename"
                  ;;
              esac
              # Delete file to avoid duplicate name conflicts 
              rm $filename

              echo "🤔 Download $toolchain_name => ($toolchain_url)"
            else
              # If from git
              toolchain_repo=$(echo $toolchain | jq -r ".repo")
              toolchain_branch=$(echo $toolchain | jq -r ".branch")
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name

              echo "🤔 Clone $toolchain_name => ($toolchain_repo)"
            fi

            jq -r ".binaryEnv[] | tostring" <<< "$toolchain" | while read -r subPath; do
              echo "${{ env.WORKSPACE }}/$toolchain_name/$subPath" >> $GITHUB_PATH
            done
          done

      - name: 😎 Set build args
        id: generate-args
        env:
          PARAMS: "${{ toJSON(matrix.CONFIG.params) }}"
          THREAD: $(nproc --all)
        run: |
          echo "🤔 PATH Variable: $PATH"

          ARCH=$(echo $PARAMS | jq -r ".ARCH")
          CC=$(echo $PARAMS | jq -r ".CC")

          args="-j${{ env.THREAD }} O=${{ env.OUT_DIR }} ARCH=$ARCH"
          if [ -n "$CC" ]; then

            if [[ "$CC" == *"/"* ]]; then
              CC=${{ env.WORKSPACE }}/$CC
            fi

            if [ ${{ env.ENABLE_CCACHE }} = true ]; then
              args="$args CC=\"ccache $CC\""
            else
              args="$args CC=$CC"
            fi
          fi
          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2)
            if [[ "$value" == *"/"* ]]; then
              value="${{ env.WORKSPACE }}/$value"
            fi
            args="$args $key=$value"
          done < <(jq -r '.externalCommands | to_entries[] | "\(.key)=\(.value)"' <<< "$PARAMS")

          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "ARGS=$args" >> $GITHUB_OUTPUT

          echo "🤔 $args"

      - name: 😋 Setup SukiSU Ultra
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        if: ${{ env.ENABLE_KERNELSU == 'true' && env.ENABLE_KERNELSU_SFS == 'true' }}
        run: |
          # Delete old KernelSU
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          # Apply new KernelSU patches
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-test
          cd ./KernelSU
          
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

          cd ../
          cat arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          
      - name: 😋 Setup SukiSU SUSFS
        env: 
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
          SFS_BRANCH: ${{ matrix.CONFIG.KernelSUSFS.branches }}
        if: ${{ env.ENABLE_KERNELSU == 'true' && env.ENABLE_KERNELSU_SFS == 'true' }}
        run: |
          CONFIG_FILE=arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          # Clone repositories using the branch names
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "${{ env.SFS_BRANCH }}"
          git clone https://github.com/ShirkNeko/SukiSU_patch.git

          # Copy SUSFS patches
          cd ${{ env.KERNEL_NAME }}
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SFS_BRANCH }}.patch ./
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          #lz4k
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./lib/

          # Apply common SUSFS patch
          patch -p1 < 50_add_susfs_in_${{ env.SFS_BRANCH }}.patch
          
          cp ../SukiSU_patch/hooks/syscall_hooks.patch ./
          patch -p1 -F 3 < syscall_hooks.patch

          # Apply lz4kd Patches
          cp ../SukiSU_patch/other/zram/zram_patch/5.15/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true

          # Add KSU configuration settings
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

          # Add VFS configuration settings
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
          
          # Add SUSFS configuration settings
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          
          echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
          echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
          echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
          
          # Enable KPM
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          
          cat arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          
      - name: 🎬 Setup Cinema Kernel Features
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          CONFIG_FILE=arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          cd ${{ env.KERNEL_NAME }}

          # === USB-C EXTERNAL MONITOR / DISPLAYPORT OUTPUT ===
          # On SM8550 the DP stack is entirely vendor-side:
          #   QTI_PMIC_GLINK + QTI_ALTMODE_GLINK + UCSI_QTI_GLINK
          # These are already present in ishtar_GKI.config (applied in the vendor
          # fragment step above). The upstream generic drivers (TYPEC_DP_ALTMODE,
          # EXTCON_USB_GPIO) are wrong for this SoC — the aDSP firmware owns
          # USB-C PD negotiation over PMIC GLINK, not the kernel TCPM path.
          #
          # MI_ENABLE_DP=y is Xiaomi's own gate flag in the MSM display driver.
          # It is set in ishtar_GKI.config, but we echo it here as an explicit
          # safety net in case the vendor fragment step did not apply cleanly.
          echo "CONFIG_MI_ENABLE_DP=y" >> "$CONFIG_FILE"

          # === HDMI CEC (Consumer Electronics Control) ===
          # Allows monitor wake/sleep and remote control over HDMI/DP.
          # Without CEC, connected field monitors won't auto-wake on connect.
          echo "CONFIG_CEC_CORE=y" >> "$CONFIG_FILE"
          echo "CONFIG_MEDIA_CEC_SUPPORT=y" >> "$CONFIG_FILE"

          # === PROFESSIONAL USB AUDIO ===
          # External mics, XLR interfaces (Rode AI-Micro, Zoom AM7, MOTU M2, etc.)
          echo "CONFIG_SND_USB_AUDIO=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_AUDIO=y" >> "$CONFIG_FILE"
          echo "CONFIG_SND_RAWMIDI=y" >> "$CONFIG_FILE"
          echo "CONFIG_SND_SEQUENCER=y" >> "$CONFIG_FILE"

          # === ALSA AUDIO PIPELINE — TIMECODE & MONITORING ===
          # SND_ALOOP: virtual ALSA loopback (creates /dev/snd/pcmCXDX nodes).
          # NOTE: Android apps cannot open /dev/snd/ directly — SELinux and
          # AudioFlinger block it. SND_ALOOP is only usable via a custom Audio HAL
          # module registered in audio_policy_configuration.xml, or via root-level
          # tinyalsa tools. Kernel flag is kept as a prerequisite for future HAL work.
          # SND_HRTIMER: hrtimer-based ALSA clock — sub-ms timing independent of HZ.
          # SND_PCM_TIMER: PCM timer for sample-accurate AV sync apps.
          echo "CONFIG_SND_ALOOP=y" >> "$CONFIG_FILE"
          echo "CONFIG_SND_HRTIMER=y" >> "$CONFIG_FILE"
          echo "CONFIG_SND_PCM_TIMER=y" >> "$CONFIG_FILE"

          # === FAST USB-C EXTERNAL STORAGE ===
          # UAS protocol for fast SSD offload (Samsung T9, SanDisk Pro-G40, etc.)
          echo "CONFIG_USB_XHCI_HCD=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_STORAGE=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_UAS=y" >> "$CONFIG_FILE"

          # === CINEMA DRIVE FILESYSTEMS ===
          # exFAT: factory format for Samsung T9, SanDisk Pro-G40, SDXC cards >32GB.
          # NTFS3: kernel-native NTFS write support for Windows-formatted drives
          # common on set. Replaces FUSE-based ntfs-3g for full-speed transfers.
          echo "CONFIG_EXFAT_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NTFS3=y" >> "$CONFIG_FILE"

          # === V4L2 MEDIA FRAMEWORK + MEDIA CONTROLLER ===
          # MEDIA_CONTROLLER: MC API exposes pipeline topology (sensor→ISP→encoder)
          # required by OpenCamera HAL3, libcamera, and advanced capture tools.
          # VIDEO_FIXED_MINOR_RANGES: deterministic /dev/videoN numbering across reboots.
          # VIDEOBUF2_VMALLOC: vmalloc allocator for USB capture cards / webcams.
          echo "CONFIG_MEDIA_SUPPORT=y" >> "$CONFIG_FILE"
          echo "CONFIG_MEDIA_CONTROLLER=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEO_V4L2=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEO_V4L2_SUBDEV_API=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEO_FIXED_MINOR_RANGES=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEOBUF2_CORE=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEOBUF2_V4L2=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEOBUF2_DMA_CONTIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_VIDEOBUF2_VMALLOC=y" >> "$CONFIG_FILE"

          # === DMA-BUF HEAPS + ANDROID SYNC FENCES ===
          # Zero-copy camera → ISP → encoder pipeline. Without DMA-BUF heaps,
          # frames are CPU-copied between pipeline stages, dropping frames at 4K.
          # SYNC_FILE: Android sync fence framework for camera frame ordering
          # and display composition pipeline correctness.
          echo "CONFIG_DMABUF_HEAPS=y" >> "$CONFIG_FILE"
          echo "CONFIG_DMABUF_HEAPS_SYSTEM=y" >> "$CONFIG_FILE"
          echo "CONFIG_DMABUF_HEAPS_CMA=y" >> "$CONFIG_FILE"
          echo "CONFIG_SYNC_FILE=y" >> "$CONFIG_FILE"

          # === LOW-LATENCY SCHEDULING ===
          echo "CONFIG_HIGH_RES_TIMERS=y" >> "$CONFIG_FILE"

          # === USB GADGET (UVC / UAC2 / EXTENDED) ===
          # These are KERNEL PREREQUISITES only. Full functionality requires:
          #
          # UVC (phone as USB webcam): needs the Android 14 DeviceAsWebcam system
          # app (com.android.deviceaswebcam) built into the ROM + ro.usb.uvc.enabled=true
          # + Qualcomm init.rc DeviceAsWebcam patch (LineageOS Gerrit #395890).
          # On SM8550, usbd (sys.usb.configfs=2) owns the gadget HAL — a KSU
          # module cannot directly write configfs while usbd is running.
          #
          # UAC2 (phone as USB audio interface): requires a userspace bridge daemon
          # (tinyalsa-based) and registration in audio_policy_configuration.xml.
          # The UAC2 ALSA card alone is not routable via Android AudioFlinger.
          #
          # F_FS: FunctionFS for custom gadget functions (tethered control apps).
          # F_RNDIS: USB Ethernet tethering alongside audio/video gadget output.
          echo "CONFIG_USB_GADGET=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_CONFIGFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_CONFIGFS_F_UVC=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_CONFIGFS_F_UAC2=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_CONFIGFS_F_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_CONFIGFS_F_RNDIS=y" >> "$CONFIG_FILE"

          echo "✅ Cinema kernel features appended to $CONFIG_FILE"

      - name: ⏱️ Enable HZ_1000 (experimental)
        if: ${{ env.ENABLE_HZ_1000 == 'true' }}
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          cd ${{ env.KERNEL_NAME }}
          DEFCONFIG="arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}"
          HZ_FRAGMENT="${{ env.WORKSPACE }}/Kernel/configs/hz1000.config"

          # CONFIG_HZ is a Kconfig `choice` block. merge_config.sh is the correct
          # approach — plain sed is brittle for choice symbols because it cannot
          # resolve dependent Kconfig constraints. The fragment deselects HZ_300
          # and selects HZ_1000; merge_config.sh resolves the choice cleanly.
          scripts/kconfig/merge_config.sh -m "$DEFCONFIG" "$HZ_FRAGMENT"
          cp .config "$DEFCONFIG"
          echo "✅ HZ_1000 merged into $DEFCONFIG via merge_config.sh"

          # GKI ABI enforcement rejects any defconfig that differs from the
          # locked gki_defconfig (CONFIG_HZ_300=y). Bypass check_defconfig in
          # build.config.gki so the build proceeds. Non-GKI-compliant output.
          if [ -f "build.config.gki" ]; then
            sed -i 's/check_defconfig//' build.config.gki
            echo "✅ check_defconfig bypass applied to build.config.gki"
          fi

          echo "⚠️  HZ_1000 active — kernel is NOT GKI ABI compliant"

      - name: 😋 Add Custom Kernel Name
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          CONFIG_FILE=arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          cd ${{ env.KERNEL_NAME }}
          sed -i 's/${scm_version}//' scripts/setlocalversion
          sed -i 's/-dirty//' scripts/setlocalversion
          echo 'CONFIG_LOCALVERSION="-cinema@ishtar"' >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=y" >> "$CONFIG_FILE"
          
      - name: 😋 Setup LXC docker
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          DEFCONFIG: ${{ env.WORKSPACE }}/${{ env.KERNEL_NAME }}/arch/${{ steps.generate-args.outputs.ARCH }}/configs/${{env.KERNEL_DEFCONFIG_PATH}}
          ADD_DEFCONFIG: ${{ env.WORKSPACE }}/Kernel/LXC/LXC_defconfig
        if: ${{ env.ENABLE_LXC == 'true' }}
        run: |
          # Add configuration
          for config in $(cat ${{ env.ADD_DEFCONFIG }})
          do
            echo $config >> ${{ env.DEFCONFIG }}
          done

          # Apply patch
          if [ -f kernel/cgroup.c ]; then
            row=$(sed -n -e '/^static int cgroup_add_file/=' kernel/cgroup.c)
            touch /tmp/tmp.txt
            sed -n -e '/static int cgroup_add_file/,/return 0/p' kernel/cgroup.c >> /tmp/tmp.txt
            row2=$(sed -n -e '/return 0/=' /tmp/tmp.txt)
            row3=$(echo `expr $row + $row2 - 1`)
            sed -i "$row3 i\        }" kernel/cgroup.c
            sed -i "$row3 i\                kernfs_create_link(cgrp->kn, name, kn);" kernel/cgroup.c
            sed -i "$row3 i\                snprintf(name, CGROUP_FILE_NAME_MAX, \"%s.%s\", cft->ss->name, cft->name);" kernel/cgroup.c
            sed -i "$row3 i\        if (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) && !(cft->flags & CFTYPE_NO_PREFIX)) {" kernel/cgroup.c
            echo "🎖️ Modify kernel/cgroup.c"
          fi
          if [ -f kernel/cgroup/cgroup.c ]; then
            row=$(sed -n -e '/^static int cgroup_add_file/=' kernel/cgroup/cgroup.c)
            touch /tmp/tmp.txt
            sed -n -e '/static int cgroup_add_file/,/return 0/p' kernel/cgroup/cgroup.c >> /tmp/tmp.txt
            row2=$(sed -n -e '/return 0/=' /tmp/tmp.txt)
            row3=$(echo `expr $row + $row2 - 1`)
            sed -i "$row3 i\        }" kernel/cgroup/cgroup.c
            sed -i "$row3 i\                kernfs_create_link(cgrp->kn, name, kn);" kernel/cgroup/cgroup.c
            sed -i "$row3 i\                snprintf(name, CGROUP_FILE_NAME_MAX, \"%s.%s\", cft->ss->name, cft->name);" kernel/cgroup/cgroup.c
            sed -i "$row3 i\        if (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) && !(cft->flags & CFTYPE_NO_PREFIX)) {" kernel/cgroup/cgroup.c
            echo "🎖️ Modify kernel/cgroup/cgroup.c"
          fi
          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            git am -s < ${{ env.WORKSPACE }}/LXC/Patches/xt_qtaguid.patch
            echo "🎖️ Apply xt_qtaguid.patch"
          fi

      - name: 👍 Start building the kernel
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          ARGS: ${{ steps.generate-args.outputs.ARGS }}
        run: |
          echo "🤔 PATH Variable: $PATH"
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          make ${{ env.ARGS }} ${{ env.KERNEL_DEFCONFIG_PATH }}
          make ${{ env.ARGS }}
          # tree ${{ env.OUT_DIR }}

      - name: 🔥 Add KPM patch
        env: 
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        run: |         
          echo "Patching Image file..."
          cd "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
          chmod 777 patch
          ./patch
          rm -rf Image
          mv oImage Image

      - name: 💛 Upload Image
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: 💙 Upload Image.gz
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image.gz
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: 💙 Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image.gz-dtb
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: 💜 Upload dtb
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-dtb
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: ❤️ Upload dtbo.img
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-dtbo.img
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7

      - name: ☢️ Upload output directory
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Output
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/
          retention-days: 7

      - name: ⏰ Pack Anykernel3
        if: ${{ env.USE_ANYKERNEL3 == 'true' }}
        env:
          PARAMS: "${{ toJSON(matrix.CONFIG.AnyKernel3) }}"
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
          ANYKERNEL3_FILE: "${{ env.WORKSPACE }}/AnyKernel3-${{ env.KERNEL_NAME }}-Cinema-SukiSU_Ultra-${{ env.BUILD_DATE }}"
        run: |
          if echo -n '${{ env.PARAMS }}' | jq -e 'has("custom")' > /dev/null; then
            CUSTOM_ANYKERNEL3=$(echo -n '${{ env.PARAMS }}' | jq -r ".custom")
            ANYKERNEL_REPO=$(echo $CUSTOM_ANYKERNEL3 | jq -r ".repo")
            ANYKERNEL_BRANCH=$(echo $CUSTOM_ANYKERNEL3 | jq -r ".branch")
            git clone --recursive --depth=1 -j $(nproc) --branch $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3
            echo "🤔 Use custom AnyKernel3 => ($ANYKERNEL_REPO)"
          else
            git clone --recursive --depth=1 -j $(nproc) https://github.com/osm0sis/AnyKernel3 AnyKernel3
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
            sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
            echo "🤔 Use origin Anykernel3 => (https://github.com/osm0sis/AnyKernel3)"
          fi


          if [ -e "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb ./AnyKernel3/
          else
            if [ -e "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image" ]; then
              cp -f ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image ./AnyKernel3/
            fi
            if [ -e "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz" ]; then
              cp -f ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz ./AnyKernel3/
            fi
            if [ -e "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo" ]; then
              cp -f ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo ./AnyKernel3/
            fi
            if [ -e "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" ]; then
              cp -f ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img ./AnyKernel3/
            fi
          fi

          cd AnyKernel3/
          zip -q -r "${{ env.ANYKERNEL3_FILE }}.zip" *

      - name: "💾 Upload AnyKernel3 image => (${{ env.BUILD_DATE }})"
        env:
          ANYKERNEL3_FILE: "AnyKernel3-${{ env.KERNEL_NAME }}-Cinema-SukiSU_Ultra-${{ env.BUILD_DATE }}"
        uses: actions/upload-artifact@v4
        if: ${{ env.USE_ANYKERNEL3 == 'true' }}
        with:
          name: "${{ env.ANYKERNEL3_FILE }}"
          path: AnyKernel3/*

      - name: 🧧 Create GitHub Release => (${{ env.BUILD_DATE }})
        env:
          ANYKERNEL3_FILE: "${{ env.WORKSPACE }}/AnyKernel3-${{ env.KERNEL_NAME }}-Cinema-SukiSU_Ultra-${{ env.BUILD_DATE }}"
          RELEASE_NAME: "Xiaomi 13 Ultra (Ishtar) - Cinema / SukiSU Ultra / KPM / SUSFS"
          RELEASE_NOTES: |
            Cinema kernel build for Xiaomi 13 Ultra (ishtar) — SM8550 / GKI 5.15

            === CINEMA FEATURES ===
            -> DisplayPort Alt Mode (USB-C external monitor/recorder output)
            -> USB Audio Class 2.0 (XLR interfaces, external mics, mixers)
            -> USB UAS fast storage (USB-C SSD offload at full speed)
            -> V4L2 media framework (camera pipeline, external capture)
            -> 1000Hz timer (low-latency audio/video frame scheduling)
            -> USB UVC gadget (phone as USB camera output)
            -> USB UAC2 gadget (phone as USB audio source)

            === ROOT / SECURITY ===
            -> SukiSU Ultra (kernel-mode root)
            -> SUSFS (root hiding — Magic Mount, SUS Path, SUS Mount)
            -> Manual Hooks for Better Hiding
            -> KPM (Kernel Patch Manager) for custom patches
            -> Wireguard VPN support
            -> Magic Mount Support

            === RECOMMENDED CINEMA APPS ===
            -> FiLMiC Pro (LogV3 10-bit, manual controls)
            -> ProCam X (14-bit RAW DNG, manual)
            -> MCPro+ (multi-cam cinema)
            -> Open Camera (free, full Camera2 API)

            === NOTES ===
            -> SUS SU Mode 2 disabled — non-kprobe hooks, not needed
            -> Use HorizonKernelFlasher: https://github.com/libxzr/HorizonKernelFlasher
            -> Kernel Flasher (old) is broken with latest SUSFS

            === REQUIRED MODULES ===
            -> SUSFS module: https://github.com/sidex15/ksu_module_susfs
            -> ZygiskNext: https://github.com/Dr-TSNG/ZygiskNext
            -> PlayIntegrityFix: https://github.com/chiteroman/PlayIntegrityFix
            
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        if: ${{ env.USE_ANYKERNEL3 == 'true' && env.CONFIRM_RELEASE == 'true' }}
        with:
          tag_name: Ishtar-Cinema-SukiSU_Ultra-v${{ env.BUILD_DATE }}.${{ github.run_number }}
          files: "${{ env.ANYKERNEL3_FILE }}.zip"
          generate_release_notes: true
          name: ${{ env.RELEASE_NAME }}  # Pass the RELEASE_NAME to the action
          body: ${{ env.RELEASE_NOTES }}  # Pass the RELEASE_NOTES to the action
